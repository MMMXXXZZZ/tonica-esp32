<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-owns="html1" width="923" height="522"><defs><path d="M3 9h4l5-4v14l-5-4H3z" fill="#E8EDF7" id="reuse-0"/></defs><style>.title{font-variation-settings: "opsz" 96}@font-face{font-family:Bodoni Moda;src:url(https://tonica.m44.cl/fonts/bodoni-moda-latin.woff2) format("woff2");font-style:normal;font-weight:400 900;font-display:swap;font-variation-settings: "opsz" 96;}@font-face{font-family:Bodoni Moda;src:url(https://tonica.m44.cl/fonts/bodoni-moda-italic-latin.woff2) format("woff2");font-style:italic;font-weight:500;font-display:swap;font-variation-settings: "opsz" 96;}@font-face{font-family:Hanken Grotesk;src:url(https://tonica.m44.cl/fonts/hanken-grotesk-latin.woff2) format("woff2");font-style:normal;font-weight:100 900;font-display:swap}</style><g id="html1" aria-owns="head1 body1"><g id="body1" aria-owns="rows"><rect width="923" height="522" fill="#2B1A33"/><g id="rows" aria-owns="row1 row2 row3"><g id="row1" aria-labelledby="h-listenica" mask="url(#mask-for-row11)" aria-owns="h-listenica body2 readmore-listenica"><rect width="923" fill="#D9E4DC" height="157.3"/><mask id="mask-for-row11"><rect width="923" height="157.3" fill="#fff"/></mask><text color="#14233A" dominant-baseline="text-after-edge" font-family="Bodoni Moda, Didot, &quot;Bodoni 72&quot;, serif" font-size="67.85" font-stretch="100%" font-weight="500" letter-spacing="-1.357" unicode-bidi="isolate" word-spacing="0" writing-mode="horizontal-tb" fill="#14233A" aria-level="2" id="h-listenica" class="title"><tspan x="41.533" lengthAdjust="spacingAndGlyphs" textLength="267.233" y="117.15">Listenica</tspan></text><g id="body2" aria-owns="p1"><text color="#14233A" dominant-baseline="text-after-edge" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="17" font-stretch="100%" font-weight="400" unicode-bidi="isolate" word-spacing="0" writing-mode="horizontal-tb" fill="#14233A" id="p1"><tspan x="510.117" y="51.4" textLength="330" lengthAdjust="spacingAndGlyphs">is a foundation based on many open source </tspan><tspan x="510.117" y="76.9" textLength="362.367" lengthAdjust="spacingAndGlyphs">projects to handle Spotify Connect streams and </tspan><tspan x="510.117" y="102.4" textLength="344.767" lengthAdjust="spacingAndGlyphs">decode them, and is small enough to run on a </tspan><tspan x="510.117" y="127.9" textLength="120.55" lengthAdjust="spacingAndGlyphs">microcontroller.</tspan></text><text color="#14233A" dominant-baseline="text-after-edge" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="17" font-stretch="100%" font-weight="400" unicode-bidi="isolate" word-spacing="0" writing-mode="horizontal-tb" fill="#14233A"><tspan x="510.117" y="129.65" textLength="0" lengthAdjust="spacingAndGlyphs"/></text></g></g><g id="row2" aria-labelledby="h-tonica" mask="url(#mask-for-row21)" aria-owns="h-tonica tonica-intro readmore installer"><rect width="923" height="207.4" y="157.3" fill="#2337C6"/><mask id="mask-for-row21"><rect width="923" height="207.4" y="157.3" fill="#fff"/></mask><text color="#FFF" dominant-baseline="text-after-edge" font-family="Bodoni Moda, Didot, &quot;Bodoni 72&quot;, serif" font-size="67.85" font-stretch="100%" font-weight="700" letter-spacing="-1.357" unicode-bidi="isolate" word-spacing="0" writing-mode="horizontal-tb" fill="#FFF" aria-level="1" class="title" id="h-tonica"><tspan x="41.533" textLength="209.567" lengthAdjust="spacingAndGlyphs" y="299.5">Tónica</tspan></text><g id="tonica-intro" aria-owns="p6"><text color="#FFF" dominant-baseline="text-after-edge" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="17" font-stretch="100%" font-weight="400" unicode-bidi="isolate" word-spacing="0" writing-mode="horizontal-tb" fill="#FFF" id="p6"><tspan x="510.117" y="246.5" textLength="329.883" lengthAdjust="spacingAndGlyphs">is the Spotify Connect receiver that runs on </tspan><tspan x="510.117" y="272" textLength="351.483" lengthAdjust="spacingAndGlyphs">ESP32-S3 plus a USB-C audio dongle. No extra </tspan><tspan x="510.117" y="297.5" textLength="76.533" lengthAdjust="spacingAndGlyphs">hardware.</tspan></text><text color="#FFF" dominant-baseline="text-after-edge" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="17" font-stretch="100%" font-weight="400" unicode-bidi="isolate" word-spacing="0" writing-mode="horizontal-tb" fill="#FFF"><tspan x="510.117" y="299.25" textLength="0" lengthAdjust="spacingAndGlyphs"/></text><text color="#FFF" dominant-baseline="text-after-edge" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="17" font-stretch="100%" font-weight="400" unicode-bidi="isolate" word-spacing="0" writing-mode="horizontal-tb" fill="#FFF"><tspan x="510.117" y="299.25" textLength="0" lengthAdjust="spacingAndGlyphs"/></text></g></g><g id="row3" aria-labelledby="h-sinfonica" mask="url(#mask-for-row31)" aria-owns="h-sinfonica body3 readmore-sinfonica"><rect width="923" height="157.3" y="364.7" fill="#2B1A33"/><mask id="mask-for-row31"><rect width="923" height="157.3" y="364.7" fill="#fff"/></mask><text color="#B9A7C9" dominant-baseline="text-after-edge" font-family="Bodoni Moda, Didot, &quot;Bodoni 72&quot;, serif" font-size="67.85" font-stretch="100%" font-style="italic" font-weight="500" letter-spacing="-1.357" unicode-bidi="isolate" word-spacing="0" writing-mode="horizontal-tb" fill="#B9A7C9" aria-level="2" id="h-sinfonica" class="title"><tspan x="41.533" textLength="269.033" y="479.85" lengthAdjust="spacingAndGlyphs">Sinfónica</tspan></text><g id="body3" aria-owns="p19"><text color="#B9A7C9" dominant-baseline="text-after-edge" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="17" font-stretch="100%" font-weight="400" unicode-bidi="isolate" word-spacing="0" writing-mode="horizontal-tb" fill="#B9A7C9" id="p19"><tspan x="510.117" y="428.85" textLength="338.767" lengthAdjust="spacingAndGlyphs">is the multi-room implementation for Tónicas </tspan><tspan x="510.117" y="454.35" textLength="338.917" lengthAdjust="spacingAndGlyphs">playing in sync, grouped and controlled from </tspan><tspan x="510.117" y="479.85" textLength="189.617" lengthAdjust="spacingAndGlyphs">your phone, 3-10ms RTT.</tspan></text><text color="#B9A7C9" dominant-baseline="text-after-edge" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="17" font-stretch="100%" font-weight="400" unicode-bidi="isolate" word-spacing="0" writing-mode="horizontal-tb" fill="#B9A7C9"><tspan x="510.117" y="481.6" textLength="0" lengthAdjust="spacingAndGlyphs"/></text></g></g></g></g></g></svg>