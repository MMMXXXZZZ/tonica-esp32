# Build check for the Listenica host on macOS (universal: Apple Silicon + Intel), plus the unit tests.
name: Listenica macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S host -B build -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --target listenica_host unit_tests -j 4
      - name: Unit tests
        run: ./build/unit_tests
