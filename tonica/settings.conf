# Tónica settings: the one file to edit before building/flashing.
# tonica/build.ps1 applies it to sdkconfig on every build (tonica/apply_settings.py),
# so changes here always take effect. Runtime settings (Wi-Fi, device name override,
# volume, TX power, OTA token, owner login) live on the board: see the serial console.

DEVICE_NAME = "Tónica"   # name shown in Spotify (the console 'name' command overrides it)
BITRATE = 320                   # Ogg Vorbis bitrate: 96 | 160 | 320

# Who may take the speaker. Tiers: the owner (saved on the board) always wins; a temporary owner
# (claimed in the pairing window below) can take it back from guests; guests follow the policy:
#   open           anyone may take over as a guest (never saved; a reboot returns to the owner)
#   owner_priority guests only while the owner / temporary owner is not connected: their music isn't
#                  playing here and their app is offline (iOS: ~30 s after locking a paused phone)
#   owner_only     guests are refused (only the owner, or a temporary owner from the window)
TAKEOVER = open
GRACE_SEC = 180                 # pairing window after boot (LED breathes soft green): while the owner's music
                                # isn't playing, any account may claim the speaker as temporary owner (0 = off)
PRESET = ""                     # 1 press with nothing playing anywhere plays this (e.g. "spotify:playlist:..."; "" = off)
RESUME_WINDOW_MIN = 120         # 1 press with nothing playing: resume the last session if it paused this recently,
                                # else play PRESET (0 = always the preset when no device is active)
GUEST_IDLE_MIN = 10             # back to the owner after a guest is idle this long (0 = never)
GUEST_MAX_MIN = 0               # back to the owner after this long even while playing (0 = no limit)
WATCHDOG_MIN = 10               # reboot if the Spotify session stays down this long while idle (0 = off)
AUTO_UPDATE = 1                 # install signed releases from GitHub by itself while idle (1 = on, 0 = off)

# Fallback output when no USB audio adapter is plugged in: pdm | i2s_dac
AUDIO_OUT = pdm
PDM_LEFT_GPIO = 4
PDM_RIGHT_GPIO = 7
PDM_CLK_GPIO = 21
I2S_BCK_GPIO = 5
I2S_WS_GPIO = 6
I2S_DOUT_GPIO = 7
I2S_MCLK_GPIO = -1
